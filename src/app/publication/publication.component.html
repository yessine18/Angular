<div class="header-section">
  <h2>Publications</h2>
  <button mat-raised-button color="primary" routerLink="/create">
    Create New Publication
  </button>
</div>
<table mat-table [dataSource]="dataSource" class="mat-elevation-z8 custom-table">

  <!-- ID Column -->
  <ng-container matColumnDef="id">
    <th mat-header-cell *matHeaderCellDef> ID </th>
    <td mat-cell *matCellDef="let element"> {{element.id}} </td>
  </ng-container>

  <!-- CIN Column -->
  <ng-container matColumnDef="type">
    <th mat-header-cell *matHeaderCellDef> TYPE </th>
    <td mat-cell *matCellDef="let element"> {{element.type}} </td>
  </ng-container>

  <!-- Name Column -->
  <ng-container matColumnDef="titre">
    <th mat-header-cell *matHeaderCellDef> Title </th>
    <td mat-cell *matCellDef="let element"> {{element.titre}} </td>
  </ng-container>

  <!-- Type Column -->
  <ng-container matColumnDef="lien">
    <th mat-header-cell *matHeaderCellDef> LIEN </th>
    <td mat-cell *matCellDef="let element"> {{element.lien}} </td>
  </ng-container>

  <!-- CV Column -->
  <ng-container matColumnDef="date">
    <th mat-header-cell *matHeaderCellDef> Date </th>
    <td mat-cell *matCellDef="let element"> {{element.date| date:'dd/MM/yyyy'}} </td>
  </ng-container>

  <!-- Date Column -->
  <ng-container matColumnDef="sourcepdf">
    <th mat-header-cell *matHeaderCellDef> SourcePdf </th>
    <td mat-cell *matCellDef="let element"> {{element.sourcepdf}} </td>
  </ng-container>
  <!-- ✅ Actions Column -->
<ng-container matColumnDef="actions">
  <th mat-header-cell *matHeaderCellDef> Actions </th>
  <td mat-cell *matCellDef="let element">
    <!-- Edit button -->
    <button mat-icon-button color="primary" routerLink="/{{element.id}}/edit">
      <mat-icon>edit</mat-icon>
    </button>

    <!-- Delete button -->
    <button mat-icon-button color="warn" (click)="deletePublication(element.id)">
      <mat-icon>delete</mat-icon>
    </button>
  </td>
</ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>
