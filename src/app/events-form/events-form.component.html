<h2 mat-dialog-title>{{ isEdit ? 'Edit Event' : 'Add Event' }}</h2>

<div mat-dialog-content *ngIf="form" [formGroup]="form"
     style="display:grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 6px;">

  <mat-form-field appearance="outline" style="grid-column: 1 / -1;">
    <mat-label>Titre</mat-label>
    <input matInput formControlName="titre" />
    <mat-error *ngIf="form.get('titre')?.hasError('required')">Titre is required</mat-error>
  </mat-form-field>

  <mat-form-field appearance="outline" style="grid-column: 1 / -1;">
    <mat-label>Lieu</mat-label>
    <input matInput formControlName="lieu" />
    <mat-error *ngIf="form.get('lieu')?.hasError('required')">Lieu is required</mat-error>
  </mat-form-field>

  
<mat-form-field appearance="outline">
  <mat-label>Date apparition</mat-label>
  <input matInput [matDatepicker]="picker" formControlName="dateApparition" />
  <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
  <mat-datepicker #picker></mat-datepicker>
</mat-form-field>

</div>

<div mat-dialog-actions align="end" style="gap: 8px;">
  <button mat-button (click)="close()" [disabled]="loading">Cancel</button>
  <button mat-raised-button color="primary" (click)="save()" [disabled]="form?.invalid || loading">
    {{ loading ? 'Saving...' : (isEdit ? 'Update' : 'Create') }}
  </button>
</div>
