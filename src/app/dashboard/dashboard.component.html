<div class="dashboard-container">
  <h1 class="dashboard-title">Dashboard Overview</h1>
  
  <div class="stats-grid">
    <mat-card class="stat-card members-card">
      <mat-card-content>
        <div class="stat-icon">
          <mat-icon>people</mat-icon>
        </div>
        <div class="stat-details">
          <h2 class="stat-number">{{NbMembers}}</h2>
          <p class="stat-label">Members</p>
        </div>
      </mat-card-content>
    </mat-card>
    
    <mat-card class="stat-card events-card">
      <mat-card-content>
        <div class="stat-icon">
          <mat-icon>event</mat-icon>
        </div>
        <div class="stat-details">
          <h2 class="stat-number">{{NbEvents}}</h2>
          <p class="stat-label">Events</p>
        </div>
      </mat-card-content>
    </mat-card>
    
    <mat-card class="stat-card tools-card">
      <mat-card-content>
        <div class="stat-icon">
          <mat-icon>build</mat-icon>
        </div>
        <div class="stat-details">
          <h2 class="stat-number">{{NbTools}}</h2>
          <p class="stat-label">Tools</p>
        </div>
      </mat-card-content>
    </mat-card>
    
    <mat-card class="stat-card articles-card">
      <mat-card-content>
        <div class="stat-icon">
          <mat-icon>article</mat-icon>
        </div>
        <div class="stat-details">
          <h2 class="stat-number">{{NbArticles}}</h2>
          <p class="stat-label">Articles</p>
        </div>
      </mat-card-content>
    </mat-card>
  </div>

  <div class="charts-container">
    <mat-card class="chart-card">
      <mat-card-header>
        <mat-card-title>
          <mat-icon class="title-icon">show_chart</mat-icon>
          Statistics Overview
        </mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <div class="chart-wrapper">
          <canvas
            baseChart
            [type]="'line'"
            [data]="chartData"
            [options]="chartOptions">
          </canvas>
        </div>
      </mat-card-content>
    </mat-card>
    
    <mat-card class="chart-card">
      <mat-card-header>
        <mat-card-title>
          <mat-icon class="title-icon">pie_chart</mat-icon>
          Member Distribution
        </mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <div class="chart-wrapper">
          <canvas
            baseChart
            [type]="'pie'"
            [data]="pieChartData"
            [options]="pieChartOptions">
          </canvas>
        </div>
      </mat-card-content>
    </mat-card>
  </div>
</div>
