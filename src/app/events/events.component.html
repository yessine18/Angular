<button mat-raised-button color="primary" (click)="addEvent()">
    Create New Event
  </button>
<mat-form-field>
  <mat-label>Filter</mat-label>
  <input matInput (keyup)="applyFilter($event)" placeholder="Ex. Mia" #input>
</mat-form-field>

<div class="mat-elevation-z8">
  <table mat-table [dataSource]="dataSource" matSort>

    <!-- ID Column -->
    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> ID </th>
      <td mat-cell *matCellDef="let row"> {{row.id}} </td>
    </ng-container>

    <!-- Progress Column -->
    <ng-container matColumnDef="titre">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Titre </th>
      <td mat-cell *matCellDef="let row"> {{row.titre}} </td>
    </ng-container>

    <!-- Name Column -->
    <ng-container matColumnDef="dateDeb">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> DATEDEB </th>
      <td mat-cell *matCellDef="let row"> {{row.dateDeb}} </td>
    </ng-container>

    <!-- Fruit Column -->
    <ng-container matColumnDef="dateFin">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> DATEFIN </th>
      <td mat-cell *matCellDef="let row"> {{row.dateFin}} </td>
    </ng-container>

    <ng-container matColumnDef="lieu">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> LIEU </th>
      <td mat-cell *matCellDef="let row"> {{row.lieu}} </td>
    </ng-container>
    
    <!-- Actions Column -->
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef> Actions </th>
      <td mat-cell *matCellDef="let element">
        <!-- Bouton Edit - AJOUTEZ (click)="editEvent(element)" -->
        <button mat-icon-button color="primary" (click)="editEvent(element)">
          <mat-icon>edit</mat-icon>
        </button>
        
        <!-- Bouton Delete -->
        <button mat-icon-button color="warn" (click)="deleteEvent(element.id)">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

    <!-- Row shown when there is no matching data. -->
    <tr class="mat-row" *matNoDataRow>
      <td class="mat-cell" colspan="4">No data matching the filter "{{input.value}}"</td>
    </tr>
  </table>

  <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" aria-label="Select page of users"></mat-paginator>
</div>
