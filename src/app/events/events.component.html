<div style="display:flex; justify-content:space-between; align-items:center; gap:16px; margin-bottom:16px;">
  <h2 style="margin:0;">Events</h2>

  <button mat-raised-button color="primary" (click)="addEvent()">
    Add Event
  </button>
</div>

<div style="overflow:auto;">
  <table mat-table [dataSource]="dataSource" class="mat-elevation-z2" style="width:100%;">

    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef>ID</th>
      <td mat-cell *matCellDef="let e">{{ e.id }}</td>
    </ng-container>

    <ng-container matColumnDef="titre">
      <th mat-header-cell *matHeaderCellDef>Titre</th>
      <td mat-cell *matCellDef="let e">{{ e.titre }}</td>
    </ng-container>

    <ng-container matColumnDef="lieu">
      <th mat-header-cell *matHeaderCellDef>Lieu</th>
      <td mat-cell *matCellDef="let e">{{ e.lieu }}</td>
    </ng-container>

    <ng-container matColumnDef="dateApparition">
      <th mat-header-cell *matHeaderCellDef>Date</th>
      <td mat-cell *matCellDef="let e">{{ e.dateApparition | date:'yyyy-MM-dd' }}</td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Actions</th>
      <td mat-cell *matCellDef="let e">
        <button mat-icon-button color="primary" (click)="editEvent(e)" aria-label="Edit">
          <mat-icon>edit</mat-icon>
        </button>

        <button mat-icon-button color="warn" (click)="deleteEvent(e)" [disabled]="!e.id" aria-label="Delete">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
</div>
