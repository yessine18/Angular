<div style="display:flex; justify-content:space-between; align-items:center; gap:16px; margin-bottom:16px;">
  <h2 style="margin:0;">Members</h2>

  <button mat-raised-button color="primary" (click)="addMember()">
    Add Member
  </button>
</div>

<mat-form-field appearance="outline" style="width: 100%; margin-bottom: 12px;">
  <mat-label>Filter</mat-label>
  <input matInput (keyup)="applyFilter($event)" placeholder="Search..." />
</mat-form-field>

<div style="overflow:auto;">
  <table mat-table [dataSource]="dataSource" class="mat-elevation-z2" style="width:100%;">

    <!-- ID -->
    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef> ID </th>
      <td mat-cell *matCellDef="let element">
        {{ element.id ?? element._id ?? '-' }}
      </td>
    </ng-container>

    <!-- CIN -->
    <ng-container matColumnDef="cin">
      <th mat-header-cell *matHeaderCellDef> CIN </th>
      <td mat-cell *matCellDef="let element">
        {{ element.cin ?? '-' }}
      </td>
    </ng-container>

    <!-- NAME -->
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef> NAME </th>
      <td mat-cell *matCellDef="let element">
        {{ getName(element) }}
      </td>
    </ng-container>

    <!-- TYPE -->
    <ng-container matColumnDef="type">
      <th mat-header-cell *matHeaderCellDef> TYPE </th>
      <td mat-cell *matCellDef="let element">
        {{ getType(element) }}
      </td>
    </ng-container>

    <!-- CV -->
    <ng-container matColumnDef="cv">
      <th mat-header-cell *matHeaderCellDef> CV </th>
      <td mat-cell *matCellDef="let element">
        <ng-container *ngIf="getCv(element) !== '-'; else noCv">
          <a [href]="getCv(element)" target="_blank" rel="noopener noreferrer">Open</a>
        </ng-container>
        <ng-template #noCv>-</ng-template>
      </td>
    </ng-container>

    <!-- DATE -->
    <ng-container matColumnDef="date">
      <th mat-header-cell *matHeaderCellDef> DATE </th>
      <td mat-cell *matCellDef="let element">
        <ng-container *ngIf="getDate(element) as d; else noDate">
          {{ d | date:'yyyy-MM-dd' }}
        </ng-container>
        <ng-template #noDate>-</ng-template>
      </td>
    </ng-container>

    <!-- ACTIONS -->
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef> ACTIONS </th>
      <td mat-cell *matCellDef="let element">
        <button mat-icon-button color="primary" (click)="editMember(element)" aria-label="Edit">
          <mat-icon>edit</mat-icon>
        </button>

        <button mat-icon-button color="warn" (click)="deleteMember(element.id ?? element._id)" aria-label="Delete">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

    <tr class="mat-row" *matNoDataRow>
      <td class="mat-cell" [attr.colspan]="displayedColumns.length">
        No members found.
      </td>
    </tr>
  </table>
</div>

<mat-paginator [pageSizeOptions]="[5, 10, 25]" [pageSize]="10" showFirstLastButtons></mat-paginator>
